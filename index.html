<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert Drifter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }
        #highscore-form {
            display: none; /* Hidden by default */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 4px solid #fff;
            text-align: center;
            color: #fff;
            z-index: 100;
        }
        #highscore-form h2 {
            margin-top: 0;
            color: #ffd700;
        }
        #initials {
            font-size: 24px;
            padding: 5px;
            width: 100px;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
            background: #000;
            border: 2px solid #fff;
            color: #fff;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            padding: 5px 10px;
            cursor: pointer;
            background: #fff;
            border: 2px solid #fff;
            margin: 5px;
            transition: all 0.2s;
        }
        button:hover {
            background: #000;
            color: #fff;
        }
        .submit-btn {
            background: #4CAF50;
            border-color: #4CAF50;
            color: #fff;
        }
        .skip-btn {
            background: #f44336;
            border-color: #f44336;
            color: #fff;
        }
        #fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 2px solid white;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            padding: 10px;
        }
        #fullscreen-btn:hover {
            background: white;
            color: black;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</head>
<body>

    <button id="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>

    <div id="game-container">
        <div id="highscore-form">
            <h2>NEW HIGH SCORE!</h2>
            <p>Enter Initials:</p>
            <input type="text" id="initials" maxlength="3" placeholder="AAA">
            <br>
            <button class="submit-btn" onclick="submitHighScore()">SUBMIT</button>
            <button class="skip-btn" onclick="skipHighScore()">SKIP</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        // Keyboard shortcuts for High Score form
        const initialsInput = document.getElementById('initials');
        
        initialsInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                window.submitHighScore();
            }
        });

        document.addEventListener('keydown', function(event) {
            const form = document.getElementById('highscore-form');
            // Only listen if form is visible
            if (form.style.display === 'block') {
                if (event.key === 'Escape') {
                    window.skipHighScore();
                }
            }
        });
    </script>
</body>
</html>
